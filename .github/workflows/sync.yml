name: Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency: sync

jobs:
  sync:
    if: vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIGITRANSIT_API_KEY: ${{ secrets.DIGITRANSIT_API_KEY }}
