services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobs
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    configs:
      - source: test_db
        target: /docker-entrypoint-initdb.d/test_db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

configs:
  test_db:
    content: "CREATE DATABASE jobs_test;"

volumes:
  pgdata:
